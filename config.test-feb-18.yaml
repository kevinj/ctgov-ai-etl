ctgov:
  api_url: https://clinicaltrials.gov/api/v2/studies
  page_size: 9000
  resume_from_csv: TRUE
  filter_advanced:
    - AREA[StudyType]INTERVENTIONAL
    - AREA[StartDate]RANGE[2013-05-01,2025-12-31]
    - SEARCH[Location](AREA[LocationCountry]Canada)
    - (AREA[Sex]FEMALE OR AREA[Sex]ALL)
    - (AREA[MaximumAge]RANGE[18 Years,MAX] OR AREA[MaximumAge]MISSING)
    - (AREA[MinimumAge]RANGE[MIN,54 Years] OR AREA[MinimumAge]MISSING)
    - (AREA[Phase]EARLY_PHASE1 OR AREA[Phase]PHASE1 OR AREA[Phase]PHASE2 OR AREA[Phase]PHASE3 OR AREA[Phase]PHASE4)
    - (AREA[InterventionType]BIOLOGICAL OR AREA[InterventionType]DRUG)

output:
  max_rows_per_file: 10000

health_canada_api:
  enabled: FALSE
  disable_cache: TRUE
  product_url: https://health-products.canada.ca/api/drug/drugproduct/?lang=en&type=json
  status_url: https://health-products.canada.ca/api/drug/status/?lang=en&type=json

